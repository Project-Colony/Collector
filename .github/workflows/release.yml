# Collector - release workflow
#
# Built from templates/sign-and-publish-caller.yml in Project-Colony-Resources.
# Assets follow the Colony naming convention, so Colony auto-detects which
# platforms Collector ships:
#
#   collector-linux  collector-windows.exe
#   collector-macos  collector-macos-x86
#
# The build legs only build, check and upload artifacts; they never see a key.
# Authenticode (SignPath, once approved), the ed25519 .sig/.meta/.meta.sig,
# verification and publishing all happen in
# .github/workflows/sign-and-publish.yml of Project-Colony-Resources, in this
# same run. See design/releases.md there, section "Shared signing workflow",
# and docs/releases.md here.
#
# Action refs are pinned to commit SHAs on purpose: the called workflow handles
# the organisation's release signing key, and whoever can move a floating tag
# can read that secret.

name: Release

on:
  push:
    branches: [main]
  # Recovery path: finish an existing DRAFT release whose run failed.
  # release-please emits `release_created` once per release, so "Re-run all
  # jobs" on the original run makes it report nothing to do and every job
  # below skip. Start the dispatch from the tag ("Use workflow from: v0.2.0",
  # or `gh workflow run release.yml --ref v0.2.0 -f tag=v0.2.0`): with SignPath
  # on, sign-and-publish refuses a run whose commit is not the tag's, since
  # SignPath records the run's commit as the source of what it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish (e.g. v0.2.0). Run from that same tag."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Assembles a release PR from the conventional commits since the last release.
  # Merging that PR is what creates the tag; everything below runs only then.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input, on purpose: when it is set, the action
      # ignores both files below, and with them the changelog sections, the
      # bump policy and the version in the manifest. The release type lives in
      # release-please-config.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please PUBLISHES the release, and moves /releases/latest,
      # before a single binary exists. For the whole build window every Colony
      # in the field would show an update whose every click fails. Held as a
      # draft here; sign-and-publish refuses anything else and publishes it
      # last, once every file is signed and verified on the release.
      - name: Hold the release as a draft until it is complete
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        # `-R` is not optional: this job has no `actions/checkout`, so `gh` has
        # no git remote to infer the repository from and dies with "fatal: not
        # a git repository". Colony v0.10.0 and Grape v0.3.0 were published
        # with no assets at all that way.
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  build:
    name: build ${{ matrix.asset }}
    needs: release-please
    # Runs on a merge that created a release, or on a recovery dispatch (when
    # release-please is skipped). NOT `always()`: a FAILED release-please must
    # stop the run at an empty draft.
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: "collector-linux"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: "collector-windows.exe"
          # "macos" is Apple Silicon, "macos-x86" is Intel. Colony picks between
          # them at runtime.
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: "collector-macos"
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: "collector-macos-x86"

    steps:
      # The tag, not the branch: a recovery dispatch must rebuild the tagged
      # commit, since the .meta sidecar binds these bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      # --locked: the shipped binary is built from the committed Cargo.lock,
      # never from whatever the registry resolves to on release day.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/collector ${{ matrix.asset }}

      - name: Name the artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\collector.exe ${{ matrix.asset }}

      # A manifest can PARSE perfectly and still leave the program listed in
      # Colony with no Download button, because none of its assets match a
      # convention. `colony validate-manifest` given the asset names catches
      # exactly that. Linux only: one check per release is enough. No key is
      # on this runner: signing happens in sign-and-publish. The downloaded
      # Colony binary runs only once its signature and signed .meta check out.
      - name: Validate colony.json
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          # Colony's ed25519 release public key: RELEASE_PUBLIC_KEYS in
          # src/signing.rs of Project-Colony/Colony, as PEM. It is public.
          # Change it here when Colony's releases are signed with a new key.
          COLONY_RELEASE_PUB: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEARNjg3Nn8H6/aBg1unwGjkUTcrdTxERNefVaqU8cFu0s=
            -----END PUBLIC KEY-----
        run: |
          d=$(mktemp -d)
          gh release download -R Project-Colony/Colony -D "$d" \
            -p colony-linux -p colony-linux.sig -p colony-linux.meta -p colony-linux.meta.sig
          printf '%s' "$COLONY_RELEASE_PUB" > "$d/release.pub"
          openssl pkeyutl -verify -pubin -inkey "$d/release.pub" -rawin \
            -in "$d/colony-linux" -sigfile "$d/colony-linux.sig"
          openssl pkeyutl -verify -pubin -inkey "$d/release.pub" -rawin \
            -in "$d/colony-linux.meta" -sigfile "$d/colony-linux.meta.sig"
          digest=$(sha256sum "$d/colony-linux" | cut -d' ' -f1)
          grep -qx 'asset=colony-linux' "$d/colony-linux.meta" \
            && grep -qx "sha256=$digest" "$d/colony-linux.meta" \
            || { echo "::error::colony-linux.meta does not describe the downloaded colony-linux"; exit 1; }
          chmod +x "$d/colony-linux"
          "$d/colony-linux" validate-manifest colony.json \
            collector-linux collector-windows.exe collector-macos collector-macos-x86
          rm -rf "$d"

      # The signature proves provenance and says nothing about whether the
      # binary RUNS. An artefact built for the wrong architecture, or one that
      # aborts under the release profile's LTO, would otherwise be signed,
      # published and installed with every check green. `--version` needs no
      # terminal, so it runs headless here. It must also print the tag's
      # version: the .meta sidecar binds these bytes to that version.
      - name: Smoke-test the artifact
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          chmod +x "$ASSET" || true
          out="$(./"$ASSET" --version)"
          echo "$out"
          if [ "$out" != "collector ${TAG#v}" ]; then
            echo "::error::$ASSET --version printed '$out', expected 'collector ${TAG#v}'"
            exit 1
          fi

      # SignPath signs only an .exe whose version resource names the project
      # and carries its version (build.rs writes it). A build that lost either
      # would be refused at signing time, hours later; this fails it here.
      # `-cne`, not `-ne`: PowerShell compares strings case-insensitively, and
      # winresource's default ProductName is the lowercase package name.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $info = (Get-Item $env:ASSET).VersionInfo
          $version = $env:TAG -replace '^v', ''
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Collector' -or $info.ProductVersion -cne $version) {
            "::error::$env:ASSET has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Collector' and '$version'"
            exit 1
          }

      # The Intel macOS artefact is cross-compiled on an arm64 runner and
      # cannot be executed there, so assert its architecture instead: that is
      # the leg with the fewest users, where a regression survives longest.
      - name: Check the cross-compiled artifact's architecture
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          file "${{ matrix.asset }}"
          file "${{ matrix.asset }}" | grep -q 'x86_64' \
            || { echo "::error::${{ matrix.asset }} is not an x86_64 binary"; exit 1; }

      # The file at the artifact root, under its release name. The name
      # prefix is what `artifact-pattern` below matches.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Authenticode (once SignPath is on), .sig/.meta/.meta.sig over the final
  # bytes, upload to the draft, download again, verify, publish. Chained as
  # `needs:` in this same run: SignPath accepts only an artifact uploaded by
  # the run that requests the signature.
  sign-and-publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      assets: "collector-linux collector-windows.exe collector-macos collector-macos-x86"
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "collector"
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
